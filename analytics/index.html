<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>pose · analytics</title>
<style>
:root{--cream:#f6f1e7;--ink:#1e1e1c;--muted:#7a756b;--green:#3d5c43;--pale:#e9efdd;--line:#ded7c9;--white:#fffdf8;--red:#a4472f}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:14px 22px;background:var(--white);border-bottom:1px solid var(--line)}
.brand{font-size:20px;font-weight:700}.brand span{margin-left:6px;color:var(--green);font-weight:500;font-size:14px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:999px;cursor:pointer;font-size:13px}
nav button.active{background:var(--pale);color:var(--ink);font-weight:600}
.meta{margin-left:auto;color:var(--muted);font-size:11px;text-align:right}
main{padding:22px;max-width:1180px;margin:0 auto}
.panel{display:flex;flex-direction:column;gap:18px}
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.card h2{margin:0 0 14px;font-size:15px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .label{color:var(--muted);font-size:12px}.kpi .value{font-size:26px;font-weight:650;letter-spacing:-.5px;margin-top:4px}.kpi .hint{color:var(--muted);font-size:11px;margin-top:2px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--muted);font-weight:500;font-size:12px}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.muted{color:var(--muted)}
.bar{height:8px;background:var(--pale);border-radius:99px;min-width:60px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.drop{color:var(--red)}
.hidden{display:none}
.filters{display:flex;gap:8px;align-items:center;margin-left:auto}
.filters label{font-size:11px;color:var(--muted);display:flex;gap:4px;align-items:center}
.filters input{border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px;background:#fff}
.filters button{border:0;border-radius:6px;padding:6px 12px;font-size:12px;background:var(--green);color:#fff;cursor:pointer}
.meta{margin-left:0}
.env-switch{display:flex;gap:6px}
.env-switch button{border:1px solid var(--line);background:var(--white);color:var(--muted);border-radius:999px;padding:6px 14px;font-size:12px;cursor:pointer}
.env-switch button.active{background:var(--pale);color:var(--ink);border-color:var(--pale);font-weight:600}
</style>
</head>
<body>
<header>
  <div class="brand">pose<span>analytics</span></div>
  <nav id="tabs">
    <button data-tab="overview" class="active">总览漏斗</button>
    <button data-tab="onboarding">引导</button>
    <button data-tab="paywall">付费墙</button>
    <button data-tab="revenue">收入</button>
    <button data-tab="ads">投放</button>
    <button data-tab="quality">数据质量</button>
  </nav>
  <div class="filters">
    <label>从 <input type="date" id="from" /></label>
    <label>到 <input type="date" id="to" /></label>
    <button id="apply">查询</button>
  </div>
  <div class="meta" id="meta">加载中…</div>
</header>
<main>
  <section class="panel" id="panel-overview">
    <div class="kpis" id="overview-kpis"></div>
    <div class="card"><h2>安装 → 支付漏斗</h2><p class="muted" id="funnel-note" style="margin:-8px 0 12px;font-size:11px"></p><table id="funnel-table"></table></div>
    <div class="card"><h2>每日数据</h2><table id="daily-table"></table></div>
  </section>
  <section class="panel hidden" id="panel-onboarding">
    <div class="card"><h2>引导逐步折损</h2><table id="onboarding-table"></table></div>
    <div class="card"><h2>答案分布</h2><div id="answers" class="two"></div></div>
  </section>
  <section class="panel hidden" id="panel-paywall">
    <div class="kpis" id="paywall-kpis"></div>
    <div class="card"><h2>按入口来源</h2><table id="paywall-source"></table></div>
    <div class="two">
      <div class="card"><h2>关闭原因</h2><table id="paywall-close"></table></div>
      <div class="card"><h2>支付结果</h2><table id="paywall-result"></table></div>
    </div>
    <div class="card"><h2>套餐选择</h2><table id="paywall-plan"></table></div>
  </section>
  <section class="panel hidden" id="panel-revenue">
    <div class="kpis" id="revenue-kpis"></div>
    <div class="card"><h2>订单明细（App Store 生产环境）</h2><table id="orders-table"></table></div>
    <div class="two">
      <div class="card"><h2>收入按天</h2><table id="orders-daily"></table></div>
      <div class="card"><h2>订阅状态</h2><table id="revenue-status"></table></div>
    </div>
    <div class="two">
      <div class="card"><h2>RevenueCat 事件类型</h2><table id="revenue-types"></table></div>
      <div class="card"><h2>最近购买事件</h2><table id="revenue-recent"></table></div>
    </div>
  </section>
  <section class="panel hidden" id="panel-ads">
    <div class="kpis" id="ads-kpis"></div>
    <div class="two">
      <div class="card"><h2>按广告系列</h2><table id="ads-campaign"></table></div>
      <div class="card"><h2>按关键词</h2><table id="ads-keyword"></table></div>
    </div>
  </section>
  <section class="panel hidden" id="panel-quality">
    <div class="card"><h2>每日事件量与下载</h2><table id="quality-daily"></table></div>
    <div class="two">
      <div class="card"><h2>版本分布</h2><table id="quality-versions"></table></div>
      <div class="card"><h2>事件量 Top</h2><table id="quality-events"></table></div>
    </div>
  </section>
</main>
<script>
const STAGES = [
  ["app_open","首次打开"],["consent_view","同意页浏览"],["consent_accept","同意并继续"],
  ["welcome","欢迎页"],["demo","Demo 页"],["q_goal","1 目标"],["q_experience","2 经验"],
  ["q_focus","3 重点"],["q_equipment","4 器械"],["q_duration","5 时长"],["q_weekly","6 频率"],
  ["q_height","7 身高"],["q_weight","8 体重"],["q_target_weight","9 目标体重"],
  ["q_comfort","10 舒适度"],["q_barrier","11 障碍"],["q_name_date","12 名字/日期"],
  ["generating","生成中"],["plan","方案页"],["plan_confirmed","滑条确认"],
  ["paywall_open","付费墙打开"],["purchase_click","点击支付"],["purchase_success","支付成功"],
  ["onboarding_complete","完成引导"],["today","进入首页"],["course_detail","课程详情"],
  ["practice_start","开始练习"],["practice_complete","完成练习"]
];
const fmt = v => (v===null||v===undefined)?"—":Number(v).toLocaleString("en-US");
const pct = v => isFinite(v)?(v*100).toFixed(1)+"%":"—";
const $ = id => document.getElementById(id);
const kpi = (label,value,hint)=>`<div class="kpi"><div class="label">${label}</div><div class="value">${value}</div><div class="hint">${hint||""}</div></div>`;

function table(node,headers,rows){
  const head = headers.map(h=>`<th class="${h.num?"num":""}">${h.label}</th>`).join("");
  const body = rows.length
    ? rows.map(r=>`<tr>${r.map(c=>`<td class="${typeof c==="number"?"num":""}">${typeof c==="number"?fmt(c):(c??"—")}</td>`).join("")}</tr>`).join("")
    : `<tr><td colspan="${headers.length}" class="muted">该区间暂无数据</td></tr>`;
  node.innerHTML = `<thead><tr>${head}</tr></thead><tbody>${body}</tbody>`;
}

let DATA = null;
let RANGE = { from:"", to:"" };
const inRange = day => (!RANGE.from || day>=RANGE.from) && (!RANGE.to || day<=RANGE.to);

function aggregate(){
  const daily = DATA.daily||{};
  const downloads = ((DATA.quality||{}).asc||[]).filter(r=>inRange(r.day)).reduce((s,r)=>s+(r.downloads||0),0);
  const installs = (daily.installs||[]).filter(r=>inRange(r.day)).reduce((s,r)=>s+r.n,0);
  const stages = {};
  for(const r of daily.funnel||[]) if(inRange(r.day)) stages[r.milestone]=(stages[r.milestone]||0)+r.users;
  const paywall = {opened:0,closed:0,clicked:0,succeeded:0};
  for(const r of daily.paywall||[]) if(inRange(r.day)){
    paywall.opened+=r.opened||0; paywall.closed+=r.closed||0;
    paywall.clicked+=r.clicked||0; paywall.succeeded+=r.succeeded||0;
  }
  const orders = {units:0,revenue:0};
  for(const r of (DATA.orders||{}).daily||[]) if(inRange(r.day)){
    orders.units+=r.units||0; orders.revenue+=r.revenue||0;
  }
  return {downloads,installs,stages,paywall,orders};
}

function renderOverview(){
  const a = aggregate();
  const downloads = a.downloads, opens = a.stages.app_open||0, consent = a.stages.consent_accept||0;
  const complete = a.stages.onboarding_complete||0;
  const paywallUsers = a.stages.paywall_open||0;
  const success = a.stages.purchase_success||0;
  const clicked = a.stages.purchase_click||0;

  $("overview-kpis").innerHTML =
    kpi("App Store 下载",fmt(downloads),"该区间下载")+
    kpi("有埋点打开",fmt(opens),downloads?`${pct(opens/downloads)} of 下载`:"")+
    kpi("同意协议",fmt(consent),opens?`${pct(consent/opens)} of 打开`:"")+
    kpi("完成引导",fmt(complete),consent>0?`${pct(complete/consent)} of 同意`:"同意事件缺失")+
    kpi("付费墙打开",fmt(paywallUsers),`人数 · 人次 ${fmt(a.paywall.opened)}`)+
    kpi("支付成功",fmt(success),clicked?`${pct(success/clicked)} of 点击`:"");

  const rows=[]; let prev=opens;
  rows.push(["App Store 下载",downloads,"—","100.0%","—"]);
  rows.push(["首次打开（有埋点）",opens,downloads?pct(opens/downloads):"—",downloads?pct(opens/downloads):"—",
    downloads>opens?`−${fmt(downloads-opens)}`:"—"]);
  let last=0; STAGES.forEach((s,i)=>{ if((a.stages[s[0]]||0)>0) last=i; });
  STAGES.forEach((s,i)=>{
    if(s[0]==="app_open") return;
    if(i>last+1) return;
    const users=a.stages[s[0]]||0, step=prev>0?users/prev:0, cum=downloads>0?users/downloads:0;
    rows.push([s[1],users,step?pct(step):"—",pct(cum),(prev-users)>0?`−${fmt(prev-users)}`:"—"]);
    prev=users;
  });
  table($("funnel-table"),[{label:"步骤"},{label:"人数",num:true},{label:"步转化",num:true},{label:"累计",num:true},{label:"流失",num:true}],rows);

  const downloadMap = new Map((((DATA.quality||{}).asc)||[]).map(r=>[r.day,r.downloads]));
  const dayMap = new Map((DATA.daily&&DATA.daily.installs||[]).map(r=>[r.day,r.n]));
  const rowsDaily = [...dayMap.keys()].filter(inRange).sort((x,y)=>y.localeCompare(x)).map(day=>{
    const st = {};
    for(const r of (DATA.daily.funnel||[])) if(r.day===day) st[r.milestone]=r.users;
    const pw = (DATA.daily.paywall||[]).find(r=>r.day===day)||{opened:0,closed:0,clicked:0,succeeded:0};
    return [day,downloadMap.get(day)||0,dayMap.get(day)||0,st.consent_accept||0,st.onboarding_complete||0,st.paywall_open||0,pw.opened,pw.succeeded];
  });
  table($("daily-table"),[
    {label:"日期"},{label:"下载",num:true},{label:"打开",num:true},{label:"同意",num:true},
    {label:"完成引导",num:true},{label:"付费墙(人)",num:true},{label:"付费墙(次)",num:true},{label:"支付成功",num:true}
  ],rowsDaily);
}

function renderOnboarding(){
  const a = aggregate();
  const rows = [];
  let prev = a.stages.consent_accept||0;
  for(const [key,label] of STAGES.filter(s=>/^q_|^welcome$|^demo$/.test(s[0]))){
    const users = a.stages[key]||0;
    const step = prev>0?users/prev:0;
    rows.push([label,users,step?pct(step):"—"]);
    prev = users || prev;
  }
  table($("onboarding-table"),[{label:"步骤"},{label:"到达",num:true},{label:"步转化",num:true}],rows);
  $("answers").innerHTML = `<p class="muted">答案分布按整个快照区间统计：见下方。</p>`;
  const groups = new Map();
  for(const x of (DATA.onboarding&&DATA.onboarding.answers)||[]){ if(!groups.has(x.step)) groups.set(x.step,[]); groups.get(x.step).push(x); }
  for(const [step,items] of [...groups].slice(0,8)){
    $("answers").innerHTML += `<div><b>${step}</b>${items.slice(0,6).map(x=>`<div class="muted" style="display:flex;justify-content:space-between"><span>${String(x.answer).slice(0,30)}</span><b>${x.n}</b></div>`).join("")}</div>`;
  }
}

function renderPaywall(){
  const a = aggregate();
  const p = a.paywall, users = a.stages.paywall_open||0;
  $("paywall-kpis").innerHTML =
    kpi("打开人数",fmt(users),"去重")+
    kpi("打开人次",fmt(p.opened),"含重复打开")+
    kpi("关闭",fmt(p.closed),p.opened?`关闭率 ${pct(p.closed/p.opened)}`:"")+
    kpi("点击支付",fmt(p.clicked),p.opened?`点击率 ${pct(p.clicked/p.opened)}`:"")+
    kpi("成功",fmt(p.succeeded),p.clicked?`完成率 ${pct(p.succeeded/p.clicked)}`:"")+
    kpi("端到端",p.opened?pct(p.succeeded/p.opened):"—","成功 / 打开人次");
  const group = (node,items)=>table(node,[{label:"分组"},{label:"打开",num:true},{label:"关闭",num:true},{label:"点击",num:true},{label:"成功",num:true},{label:"转化",num:true}],
    (items||[]).map(r=>[r.k,r.opened,r.closed,r.clicked,r.succeeded,r.opened?pct(r.succeeded/r.opened):"—"]));
  const d = DATA.paywall||{};
  group($("paywall-source"),d.bySource);
  group($("paywall-close"),d.byCloseReason);
  group($("paywall-result"),d.byResult);
  group($("paywall-plan"),d.byPlan);
}

function renderRevenue(){
  const a = aggregate();
  const d = DATA.revenue||{};
  const st = new Map((d.statuses||[]).map(r=>[r.status,r.n]));
  $("revenue-kpis").innerHTML =
    kpi("订单数",fmt(a.orders.units),"App Store 生产")+
    kpi("收入",a.orders.revenue?a.orders.revenue.toFixed(2):"0","按商店币种求和")+
    kpi("客单价",a.orders.units?(a.orders.revenue/a.orders.units).toFixed(2):"—","收入 / 订单")+
    kpi("活跃订阅",fmt((st.get("active")||0)+(st.get("trial")||0)),"RC 当前状态")+
    kpi("退款",fmt(st.get("refunded")||0),"")+
    kpi("试用中",fmt(st.get("trial")||0),"");
  table($("orders-table"),
    [{label:"日期"},{label:"产品"},{label:"国家"},{label:"数量",num:true},{label:"单价",num:true},{label:"小计",num:true},{label:"币种"}],
    ((DATA.orders||{}).rows||[]).filter(r=>inRange(r.day)).map(r=>[r.day,r.product,r.country,r.units,
      r.customer_price?r.customer_price.toFixed(2):"—",
      r.customer_price?(r.customer_price*r.units).toFixed(2):"—",r.currency||"—"]));
  table($("orders-daily"),[{label:"日期"},{label:"订单",num:true},{label:"收入",num:true}],
    ((DATA.orders||{}).daily||[]).filter(r=>inRange(r.day)).map(r=>[r.day,r.units,r.revenue?r.revenue.toFixed(2):"—"]));
  table($("revenue-status"),[{label:"状态"},{label:"人数",num:true}],(d.statuses||[]).map(r=>[r.status,r.n]));
  table($("revenue-types"),[{label:"类型"},{label:"次数",num:true},{label:"金额",num:true}],
    (d.totals||[]).map(r=>[r.type,r.n,r.amount?r.amount.toFixed(2):"—"]));
  table($("revenue-recent"),[{label:"时间"},{label:"类型"},{label:"产品"},{label:"周期"},{label:"价格"}],
    (d.recent||[]).slice(0,20).map(r=>[String(r.time).replace("T"," ").slice(0,19),r.type,r.product_id||"—",r.period_type||"—",r.price?`${r.price} ${r.currency||""}`:"—"]));
}

function renderAds(){
  const d = DATA.ads||{}, t = d.totals||{};
  $("ads-kpis").innerHTML =
    kpi("花费",t.spend?t.spend.toFixed(2):"0","Apple Ads")+
    kpi("安装",fmt(t.installs||0),"")+
    kpi("CPA",t.installs?(t.spend/t.installs).toFixed(2):"—","")+
    kpi("点击",fmt(t.taps||0),"")+
    kpi("点击→安装",t.taps?pct(t.installs/t.taps):"—","");
  const rows = items => (items||[]).map(r=>[r.campaign||r.keyword||"—",r.spend?r.spend.toFixed(2):"0",r.installs,r.installs?(r.spend/r.installs).toFixed(2):"—"]);
  table($("ads-campaign"),[{label:"广告系列"},{label:"花费",num:true},{label:"安装",num:true},{label:"CPA",num:true}],rows(d.byCampaign));
  table($("ads-keyword"),[{label:"关键词"},{label:"花费",num:true},{label:"安装",num:true},{label:"CPA",num:true}],rows(d.byKeyword));
}

function renderQuality(){
  const d = DATA.quality||{};
  const asc = new Map((d.asc||[]).map(r=>[r.day,r.downloads]));
  const opens = new Map((d.opens||[]).map(r=>[r.day,r.n]));
  table($("quality-daily"),[{label:"日期"},{label:"事件",num:true},{label:"人数",num:true},{label:"下载",num:true},{label:"打开",num:true}],
    (d.daily||[]).filter(r=>inRange(r.day)).map(r=>[r.day,r.events,r.users,asc.get(r.day)||"—",opens.get(r.day)||"—"]));
  table($("quality-versions"),[{label:"版本"},{label:"人数",num:true}],(d.versions||[]).map(r=>[r.k,r.n]));
  table($("quality-events"),[{label:"事件"},{label:"次数",num:true}],(d.topEvents||[]).map(r=>[r.k,r.n]));
}

function show(tab){
  if(!DATA) return;
  for(const b of document.querySelectorAll("#tabs button")) b.classList.toggle("active",b.dataset.tab===tab);
  for(const p of document.querySelectorAll(".panel")) p.classList.toggle("hidden",p.id!=="panel-"+tab);
  const meta = `统计区间 ${RANGE.from||"—"} ~ ${RANGE.to||"—"} · 快照更新：${String(DATA.generated_at||"").replace("T"," ").slice(0,16)} UTC`;
  $("meta").textContent = meta;
  if(tab==="overview") renderOverview();
  if(tab==="onboarding") renderOnboarding();
  if(tab==="paywall") renderPaywall();
  if(tab==="revenue") renderRevenue();
  if(tab==="ads") renderAds();
  if(tab==="quality") renderQuality();
}

async function boot(){
  try{
    const response = await fetch("./data.json?t="+Date.now(),{cache:"no-store"});
    DATA = await response.json();
    RANGE.from = DATA.range?.from || "";
    RANGE.to = DATA.range?.to || "";
    $("from").value = RANGE.from;
    $("to").value = RANGE.to;
    $("funnel-note").textContent = "下载来自 App Store（聚合）；首次打开只统计带埋点的版本 · 人数按安装去重，跨天相加为“人日”";
    show("overview");
  }catch(e){
    $("meta").textContent = "数据还没生成，请等 GitHub Action 跑完";
  }
}

document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest("button[data-tab]"); if(b) show(b.dataset.tab);
});
document.getElementById("apply").addEventListener("click",()=>{
  RANGE.from = $("from").value || "";
  RANGE.to = $("to").value || "";
  const active = document.querySelector("#tabs button.active");
  show(active?active.dataset.tab:"overview");
});
boot();
</script>
</body>
</html>
